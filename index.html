<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingsplan Tracker (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#EDEAE2; --sub:#9C9A93; --bg:#1B1D1B; --panel:#232522; --line:#33362F;
    --tape:#C98A3E; --tape-dim:#5A4A32; --ok:#6E9A7B;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#211F1B; --sub:#6B6860; --bg:#F3F0E8; --panel:#FFFFFF; --line:#DEDACD;
      --tape:#B36F26; --tape-dim:#E8D3B5; --ok:#3E7A54;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDEAE2; --sub:#9C9A93; --bg:#1B1D1B; --panel:#232522; --line:#33362F;
    --tape:#C98A3E; --tape-dim:#5A4A32; --ok:#6E9A7B;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:28px 18px 60px;}
  header{margin-bottom:22px;}
  .eyebrow{font-family:'Space Mono',monospace; font-size:12px; color:var(--tape); letter-spacing:.02em;}
  h1{font-size:28px; font-weight:800; margin:4px 0 2px; letter-spacing:-.01em;}
  .sub{color:var(--sub); font-size:14px; margin:0;}

  .tabs{display:flex; gap:8px; margin:22px 0 18px; border-bottom:1px solid var(--line);}
  .tab{
    flex:1; text-align:center; padding:11px 6px 13px; font-weight:700; font-size:15px;
    color:var(--sub); background:none; border:none; cursor:pointer; position:relative;
    font-family:'Archivo',sans-serif;
  }
  .tab.active{color:var(--ink);}
  .tab.active::after{
    content:""; position:absolute; left:10%; right:10%; bottom:-1px; height:3px;
    background:var(--tape); border-radius:2px 2px 0 0;
  }

  .plan{display:none;}
  .plan.active{display:block;}

  .exercise{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px 16px; margin-bottom:12px;
  }
  .exercise h2{font-size:16px; font-weight:700; margin:0 0 2px;}
  .exercise .note{font-size:12.5px; color:var(--sub); margin:0 0 12px;}
  .exercise.warmup .note{margin-bottom:0;}

  .sets{display:grid; grid-template-columns:auto 1fr 1fr; gap:8px 10px; align-items:center;}
  .sets.cardio-row{grid-template-columns:auto 1fr;}
  .sets .colhead{font-family:'Space Mono',monospace; font-size:11px; color:var(--sub); text-transform:lowercase;}
  .setlabel{font-family:'Space Mono',monospace; font-size:13px; color:var(--sub); white-space:nowrap;}

  .field{display:flex; align-items:stretch; gap:5px;}
  input.num{
    width:100%; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:7px;
    color:var(--ink); font-family:'Space Mono',monospace; font-size:16px; font-weight:700;
    padding:9px 8px; -moz-appearance:textfield; text-align:left;
  }
  input.num::-webkit-outer-spin-button, input.num::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input.num:focus{outline:2px solid var(--tape); outline-offset:1px; border-color:var(--tape);}

  .stepper{display:flex; flex-direction:column; flex-shrink:0; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
  .stepper button{
    background:var(--bg); border:none; color:var(--sub); width:26px; height:19px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
    font-size:9px; line-height:1;
  }
  .stepper button:first-child{border-bottom:1px solid var(--line);}
  .stepper button:active{background:var(--tape); color:var(--panel);}
  .stepper button svg{width:9px; height:9px; display:block;}

  footer{margin-top:26px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .saved{font-family:'Space Mono',monospace; font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--ok);}
  button.reset{
    font-family:'Space Mono',monospace; font-size:12px; color:var(--sub); background:none;
    border:1px solid var(--line); border-radius:7px; padding:7px 12px; cursor:pointer;
  }
  button.reset:hover{border-color:var(--tape); color:var(--tape);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">GYM · KRAFTTRAINING</div>
    <h1>Trainingsplan</h1>
    <p class="sub">Gewicht &amp; Wiederholungen je Satz — wird automatisch gespeichert.</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-plan="1">Plan 1</button>
    <button class="tab" data-plan="2">Plan 2</button>
    <button class="tab" data-plan="3">Plan 3</button>
    <button class="tab" data-plan="4">Plan 4</button>
  </div>

  <div id="plan1" class="plan active"></div>
  <div id="plan2" class="plan"></div>
  <div id="plan3" class="plan"></div>
  <div id="plan4" class="plan"></div>

  <footer>
    <div class="saved"><span class="dot"></span><span id="savedText">gespeichert</span></div>
    <div style="display:flex; gap:8px;">
      <button class="reset" id="saveBtn">Speichern</button>
      <button class="reset" id="resetBtn">Plan zurücksetzen</button>
    </div>
  </footer>
  <div style="margin-top:14px; display:flex; justify-content:flex-end;">
    <button class="reset" id="backupBtn">Backup als Excel (.xlsx)</button>
  </div>
</div>

<script>
const PLANS = {
  1: {
    title: "Beine & Oberkörper",
    warmup: { id:"warmup1", name:"Aufwärmen: Crosstrainer", note:"5 Min. ohne Intervall" },
    exercises: [
      { id:"fsu",  name:"Front Step Ups",  note:"Große Beindynamik — braucht maximale Rumpfstabilität" },
      { id:"lz",   name:"Latzug",           note:"Großer Rückenmuskel" },
      { id:"bs",   name:"Beinstrecker",     note:"Isolierte Oberschenkel-Übung" },
      { id:"bf",   name:"Butterfly",        note:"Isolierte Brust-Übung" },
      { id:"bm1",  name:"Bauchmaschine",    note:"Rumpf-Isolierung zum Abschluss" },
      { id:"hg1",  name:"Handgelenk Strecken mit Kurzhantel", note:"Unterarm-Isolierung" },
    ],
    cardio: { id:"cross1", name:"Crosstrainer-Intervalle", note:"10 Min." }
  },
  2: {
    title: "Beine & Oberkörper",
    warmup: { id:"warmup2", name:"Aufwärmen: Crosstrainer", note:"5 Min. ohne Intervall" },
    exercises: [
      { id:"bp",   name:"Beinpresse",       note:"Schwerste Übung — erfordert einen frischen, starken Rumpf" },
      { id:"kr",   name:"Kabelrudern",      note:"Großer Rückenmuskel" },
      { id:"brp",  name:"Brustpresse",      note:"Großer Brustmuskel" },
      { id:"fh",   name:"Frontheben mit Gewichtsscheibe", note:"Kleine Schulterübung" },
      { id:"bm2",  name:"Bauchmaschine",    note:"Rumpf-Isolierung zum Abschluss" },
      { id:"hg2",  name:"Handgelenk Strecken mit Kurzhantel", note:"Unterarm-Isolierung" },
    ],
    cardio: { id:"cross2", name:"Crosstrainer-Intervalle", note:"10 Min." }
  },
  3: {
    title: "Beine & Oberkörper",
    warmup: { id:"warmup3", name:"Aufwärmen: Crosstrainer", note:"5 Min. ohne Intervall" },
    exercises: [
      { id:"bsq",  name:"Box Squads mit Langhantel 20 kg Stange", note:"Grundübung Beine" },
      { id:"rdl",  name:"Rumänisches Kreuzheben mit Langhantel 20 kg Stange", note:"Rückenkette & Beinbeuger" },
      { id:"bf3",  name:"Butterfly",     note:"Isolierte Brust-Übung" },
      { id:"fp",   name:"Face Pulls am Kabel (sitzend)",    note:"Hintere Schulter & Rotatorenmanschette" },
      { id:"bm3",  name:"Bauchmaschine", note:"Rumpf-Isolierung zum Abschluss" },
      { id:"hg3",  name:"Handgelenk Strecken mit Kurzhantel", note:"Unterarm-Isolierung" },
    ],
    cardio: { id:"cross3", name:"Crosstrainer-Intervalle", note:"10 Min." }
  },
  4: {
    title: "Beine & Oberkörper",
    warmup: { id:"warmup4", name:"Aufwärmen: Crosstrainer", note:"5 Min. ohne Intervall" },
    exercises: [
      { id:"skh",  name:"Sumo Kreuzheben mit Kurzhantel", note:"Grundübung Beine & Rücken" },
      { id:"kr4",  name:"Kabelrudern",   note:"Großer Rückenmuskel" },
      { id:"bbt",  name:"Beidbeiniges Beckenheben an der Maschine", note:"Gesäß & Rumpfstabilität" },
      { id:"tzk",  name:"Trizepsdrücken am Kabel", note:"Isolierte Trizeps-Übung" },
      { id:"bm4",  name:"Bauchmaschine", note:"Rumpf-Isolierung zum Abschluss" },
      { id:"hg4",  name:"Handgelenk Strecken mit Kurzhantel", note:"Unterarm-Isolierung" },
    ],
    cardio: { id:"cross4", name:"Crosstrainer-Intervalle", note:"10 Min." }
  }
};

const STORAGE_KEY = "trainingsplan-daten-v2";
let data = {};

const UP_ICON = '<svg viewBox="0 0 10 10" fill="none"><path d="M1 6.5L5 2.5L9 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DOWN_ICON = '<svg viewBox="0 0 10 10" fill="none"><path d="M1 3.5L5 7.5L9 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : {};
  }catch(e){ data = {}; }
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    document.getElementById("savedText").textContent = "gespeichert";
  }catch(e){
    document.getElementById("savedText").textContent = "Speichern nicht möglich";
  }
}

function getVal(key){
  return data[key] !== undefined ? data[key] : "";
}

function field(key, unit, isInt){
  const step = isInt ? "1" : "0.5";
  return `
    <div class="field">
      <input class="num" type="number" inputmode="${isInt ? 'numeric' : 'decimal'}" step="${step}" min="0"
        data-key="${key}" data-unit="${unit}" value="${getVal(key)}" placeholder="0">
      <div class="stepper">
        <button type="button" class="step-up" data-key="${key}" data-unit="${unit}" aria-label="erhöhen">${UP_ICON}</button>
        <button type="button" class="step-down" data-key="${key}" data-unit="${unit}" aria-label="verringern">${DOWN_ICON}</button>
      </div>
    </div>`;
}

function renderExercise(ex){
  const rows = [1,2,3].map(s => `
      <div class="setlabel">Satz ${s}</div>
      ${field(`${ex.id}_s${s}_kg`, "kg", false)}
      ${field(`${ex.id}_s${s}_rep`, "rep", true)}`
  ).join("");

  return `
    <div class="exercise" data-exid="${ex.id}">
      <h2>${ex.name}</h2>
      <p class="note">${ex.note}</p>
      <div class="sets">
        <div></div><div class="colhead">gewicht</div><div class="colhead">wiederholungen</div>
        ${rows}
      </div>
    </div>`;
}

function renderCardio(c){
  return `
    <div class="exercise">
      <h2>${c.name}</h2>
      <p class="note">${c.note}</p>
    </div>`;
}

function renderWarmup(w){
  return `
    <div class="exercise warmup">
      <h2>${w.name}</h2>
      <p class="note">${w.note}</p>
    </div>`;
}

function renderPlan(planId){
  const plan = PLANS[planId];
  const container = document.getElementById(`plan${planId}`);
  container.innerHTML =
    renderWarmup(plan.warmup) +
    plan.exercises.map(renderExercise).join("") +
    renderCardio(plan.cardio);

  container.querySelectorAll("input.num").forEach(inp => {
    inp.addEventListener("input", () => onFieldChange(inp));
  });
  container.querySelectorAll(".step-up").forEach(btn => {
    btn.addEventListener("click", () => stepField(btn.dataset.key, btn.dataset.unit, 1));
  });
  container.querySelectorAll(".step-down").forEach(btn => {
    btn.addEventListener("click", () => stepField(btn.dataset.key, btn.dataset.unit, -1));
  });
}

function unitStep(unit){
  return unit === "kg" ? 0.5 : 1;
}

function setFieldValue(key, value){
  data[key] = value;
  const input = document.querySelector(`input.num[data-key="${key}"]`);
  if (input) input.value = value;
}

function onFieldChange(inp){
  const key = inp.dataset.key;
  const value = inp.value;
  setFieldValue(key, value);
  propagateIfSet1Kg(key, value);
  saveData();
}

function stepField(key, unit, dir){
  let v = parseFloat(data[key]);
  if (isNaN(v)) v = 0;
  v = v + dir * unitStep(unit);
  if (v < 0) v = 0;
  v = unit === "kg" ? Math.round(v * 2) / 2 : Math.round(v);
  setFieldValue(key, v);
  propagateIfSet1Kg(key, v);
  saveData();
}

// Wenn der kg-Wert von Satz 1 einer Übung eingegeben wird, auf Satz 2 & 3 übernehmen
function propagateIfSet1Kg(key, value){
  const match = key.match(/^(.+)_s1_kg$/);
  if (!match) return;
  const exId = match[1];
  setFieldValue(`${exId}_s2_kg`, value);
  setFieldValue(`${exId}_s3_kg`, value);
}

function initTabs(){
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".plan").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(`plan${tab.dataset.plan}`).classList.add("active");
    });
  });
}

document.getElementById("saveBtn").addEventListener("click", () => {
  saveData();
  const savedText = document.getElementById("savedText");
  const original = savedText.textContent;
  savedText.textContent = "Gespeichert ✓";
  clearTimeout(window._saveFeedbackTimeout);
  window._saveFeedbackTimeout = setTimeout(() => {
    savedText.textContent = original;
  }, 1500);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  const activePlan = document.querySelector(".tab.active").dataset.plan;
  const plan = PLANS[activePlan];
  const keys = [];
  plan.exercises.forEach(ex => [1,2,3].forEach(s => { keys.push(`${ex.id}_s${s}_kg`); keys.push(`${ex.id}_s${s}_rep`); }));
  keys.forEach(k => delete data[k]);
  saveData();
  renderPlan(activePlan);
});

// ---------- Backup: Export aller 4 Pläne als .xlsx (läuft komplett offline, ohne externe Bibliothek) ----------
function crc32(bytes){
  let t = crc32.table;
  if (!t){
    t = crc32.table = new Uint32Array(256);
    for (let n = 0; n < 256; n++){
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
  }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files){
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  files.forEach(f => {
    const nameBytes = enc.encode(f.name);
    const crc = crc32(f.data);
    const size = f.data.length;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true);
    lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);
    lh.setUint16(26, nameBytes.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameBytes, f.data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true);
    ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true);
    ch.setUint32(24, size, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameBytes);

    offset += 30 + nameBytes.length + size;
  });

  let centralSize = 0;
  central.forEach(c => centralSize += c.length);

  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);

  return new Blob([...parts, ...central, new Uint8Array(end.buffer)],
    { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function xmlEsc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function textCell(ref, text, style){
  return `<c r="${ref}" t="inlineStr"${style ? ` s="${style}"` : ""}><is><t>${xmlEsc(text)}</t></is></c>`;
}

function numCell(ref, raw){
  const v = parseFloat(raw);
  return isNaN(v) ? "" : `<c r="${ref}"><v>${v}</v></c>`;
}

function sheetXml(planId){
  const plan = PLANS[planId];
  let rowNum = 1;
  let rows = `<row r="1">${textCell("A1","Übung",1)}${textCell("B1","Satz",1)}${textCell("C1","Gewicht (kg)",1)}${textCell("D1","Wiederholungen",1)}</row>`;
  plan.exercises.forEach(ex => {
    [1,2,3].forEach(s => {
      rowNum++;
      rows += `<row r="${rowNum}">` +
        textCell(`A${rowNum}`, ex.name) +
        numCell(`B${rowNum}`, s) +
        numCell(`C${rowNum}`, data[`${ex.id}_s${s}_kg`]) +
        numCell(`D${rowNum}`, data[`${ex.id}_s${s}_rep`]) +
        `</row>`;
    });
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
    `<cols><col min="1" max="1" width="52" customWidth="1"/><col min="2" max="2" width="8" customWidth="1"/><col min="3" max="3" width="14" customWidth="1"/><col min="4" max="4" width="18" customWidth="1"/></cols>` +
    `<sheetData>${rows}</sheetData></worksheet>`;
}

function buildXlsx(){
  const enc = new TextEncoder();
  const ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const rns = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const pr = "http://schemas.openxmlformats.org/package/2006/relationships";
  const head = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`;
  const ids = [1,2,3,4];

  const files = [
    { name: "[Content_Types].xml", data: enc.encode(head +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
      `<Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      ids.map(i => `<Override PartName="/xl/worksheets/sheet${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("") +
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>` +
      `</Types>`) },
    { name: "_rels/.rels", data: enc.encode(head +
      `<Relationships xmlns="${pr}"><Relationship Id="rId1" Type="${rns}/officeDocument" Target="xl/workbook.xml"/></Relationships>`) },
    { name: "xl/workbook.xml", data: enc.encode(head +
      `<workbook xmlns="${ns}" xmlns:r="${rns}"><sheets>` +
      ids.map(i => `<sheet name="Plan ${i}" sheetId="${i}" r:id="rId${i}"/>`).join("") +
      `</sheets></workbook>`) },
    { name: "xl/_rels/workbook.xml.rels", data: enc.encode(head +
      `<Relationships xmlns="${pr}">` +
      ids.map(i => `<Relationship Id="rId${i}" Type="${rns}/worksheet" Target="worksheets/sheet${i}.xml"/>`).join("") +
      `<Relationship Id="rId5" Type="${rns}/styles" Target="styles.xml"/></Relationships>`) },
    { name: "xl/styles.xml", data: enc.encode(head +
      `<styleSheet xmlns="${ns}">` +
      `<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>` +
      `<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>` +
      `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>` +
      `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>` +
      `<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>` +
      `</styleSheet>`) }
  ];
  ids.forEach(i => files.push({ name: `xl/worksheets/sheet${i}.xml`, data: enc.encode(sheetXml(i)) }));
  return makeZip(files);
}

function showStatus(msg){
  const el = document.getElementById("savedText");
  el.textContent = msg;
  clearTimeout(window._statusTimeout);
  window._statusTimeout = setTimeout(() => { el.textContent = "gespeichert"; }, 2500);
}

document.getElementById("backupBtn").addEventListener("click", () => {
  try{
    const blob = buildXlsx();
    const d = new Date();
    const stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `trainingsplan-backup-${stamp}.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    showStatus("Backup erstellt ✓");
  }catch(e){
    showStatus("Backup fehlgeschlagen");
  }
});

loadData();
renderPlan(1);
renderPlan(2);
renderPlan(3);
renderPlan(4);
initTabs();
</script>
</body>
